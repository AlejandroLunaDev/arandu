name: "Bug"
description: "Report wrong behavior or an error"
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: dropdown
    id: apps
    attributes:
      label: Affected apps
      multiple: true
      options:
        - api
        - web
        - packages (contracts / db-types)
        - supabase (migrations)
        - monorepo (root / tooling)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Tap '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, environment. No secrets or tokens.
    validations:
      required: false
